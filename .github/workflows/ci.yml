name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ticketing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ticketing:ticketing@localhost:5432/ticketing_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret-test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret-test-refresh-secret
      JWT_ISSUER: ticketing-sla-api
      JWT_AUDIENCE: ticketing-sla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run build
      - run: npm run test
